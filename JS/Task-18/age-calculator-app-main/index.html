<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Age calculator app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 20px 20px 120px 20px;
      width: 600px;
    }

    .inputs {
      display: flex;
      gap: 20px;
      width: 80%;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    label {
      font-size: 12px;
      letter-spacing: 2px;
      color: gray;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 20px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-weight: bold;
    }

    input:focus {
      outline: none;
      border: 1px solid #854dff;
    }

    .error label {
      color: red;
    }

    .error input {
      border: 1px solid red;
    }

    .error small {
      color: red;
      font-size: 10px;
    }

    .divider {
      position: relative;
      margin: 30px 0;
    }

    .divider hr {
      border: 1px solid #eee;
    }

    .btn {
      position: absolute;
      color: white;
      right: 0;
      top: -25px;
      background: #854dff;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: black;
    }

    .result p {
      font-size: 40px;
      font-weight: 800;
      font-style: italic;
    }

    .result span {
      color: #854dff;
    }

    @media (max-width: 600px) {
      .inputs {
        display: flex;
        flex-direction: row;
        gap: 10px;
        width: 100%;
      }

      .input-box {
        flex: 1;
      }

      input {
        width: 100%;
        font-size: 16px;
        padding: 10px;
      }

      .btn {
        right: 50%;
        transform: translateX(50%);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="inputs">
      <div class="input-box" id="dayBox">
        <label>DAY</label>
        <input type="number" id="day" placeholder="DD">
        <small></small>
      </div>

      <div class="input-box" id="monthBox">
        <label>MONTH</label>
        <input type="number" id="month" placeholder="MM">
        <small></small>
      </div>

      <div class="input-box" id="yearBox">
        <label>YEAR</label>
        <input type="number" id="year" placeholder="YYYY">
        <small></small>
      </div>
    </div>

    <div class="divider">
      <hr>
      <button class="btn" onclick="calculateAge()">↓</button>
    </div>

    <div class="result">
      <p><span id="years">--</span> years</p>
      <p><span id="months">--</span> months</p>
      <p><span id="days">--</span> days</p>
    </div>

  </div>

  <script>
    function showError(box, message) {
      box.classList.add("error");
      box.querySelector("small").textContent = message;
    }

    function clearError(box) {
      box.classList.remove("error");
      box.querySelector("small").textContent = "";
    }

    function setError(inputBox, message) {
      inputBox.classList.add("error");
      inputBox.querySelector("small").textContent = message;
    }

    function clearError(inputBox) {
      inputBox.classList.remove("error");
      inputBox.querySelector("small").textContent = "";
    }

    function calculateAge() {
      const day = document.getElementById("day").value;
      const month = document.getElementById("month").value;
      const year = document.getElementById("year").value;

      const dayBox = document.getElementById("dayBox");
      const monthBox = document.getElementById("monthBox");
      const yearBox = document.getElementById("yearBox");

      let valid = true;

      [dayBox, monthBox, yearBox].forEach(clearError);

      if (!day) {
        setError(dayBox, "This field is required");
        valid = false;
      }

      if (!month) {
        setError(monthBox, "This field is required");
        valid = false;
      }

      if (!year) {
        setError(yearBox, "This field is required");
        valid = false;
      }

      if (!valid) return;

      if (day < 1 || day > 31) {
        setError(dayBox, "Must be a valid day");
        valid = false;
      }

      if (month < 1 || month > 12) {
        setError(monthBox, "Must be a valid month");
        valid = false;
      }

      const currentYear = new Date().getFullYear();

      if (year > currentYear) {
        setError(yearBox, "Must be in the past");
        valid = false;
      }

      if (!valid) return;

      const birthDate = new Date(year, month - 1, day);
      if (
        birthDate.getDate() != day ||
        birthDate.getMonth() != month - 1 ||
        birthDate.getFullYear() != year
      ) {
        setError(dayBox, "Must be a valid date");
        setError(monthBox, "");
        setError(yearBox, "");
        return;
      }

      const today = new Date();

      let y = today.getFullYear() - year;
      let m = today.getMonth() - (month - 1);
      let d = today.getDate() - day;

      if (d < 0) {
        m--;
        const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        d += prevMonth;
      }

      if (m < 0) {
        y--;
        m += 12;
      }

      document.getElementById("years").textContent = y;
      document.getElementById("months").textContent = m;
      document.getElementById("days").textContent = d;
    }
  </script>

</body>

</html>
