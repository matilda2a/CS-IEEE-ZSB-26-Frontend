<body>

    <script>
        let nums = [2, 12, 11, 5, 10, 1, 99];

        let result = nums.reduce((acc, el) => {
        if (el % 2 === 0) {
            return acc * el;
        } else {
            return acc + el;
        }
        }, 1);

        console.log(result); // 500
    </script>
