<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:hsl(30, 38%, 92%);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      display:flex;
      background:white;
      border-radius:10px;
      overflow:hidden;
      max-width:600px;
    }

    .image img{
      width:300px;
      height:100%;
      object-fit:cover;
    }

    .content{
      padding:30px;
    }

    .category{
      letter-spacing:4px;
      color:gray;
      margin-bottom:15px;
      text-transform:uppercase;
      font-size:12px;
    }

    h1{
      margin-bottom:20px;
    }

    .description{
      color:gray;
      line-height:1.6;
      margin-bottom:25px;
    }

    .price{
      display:flex;
      align-items:center;
      gap:15px;
      margin-bottom:25px;
    }

    .new{
      color:hsl(158, 36%, 37%);
      font-size:28px;
      font-weight:bold;
    }

    .old{
      text-decoration:line-through;
      color:gray;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:8px;
      background:hsl(158, 36%, 37%);
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:hsl(158, 36%, 20%);
    }

    @media (max-width:600px){

      .card{
        flex-direction:column;
        max-width:350px;
      }

      .image img{
        width:100%;
      }

    }
  </style>
</head>
<body>

  <div class="card">

    <div class="image">
      <img src="images/image-product-desktop.jpg" alt="perfume">
    </div>

    <div class="content">

      <p class="category">Perfume</p>

      <h1>Gabrielle Essence Eau De Parfum</h1>

      <p class="description">
        A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.
      </p>

      <div class="price">
        <span class="new">$149.99</span>
        <span class="old">$169.99</span>
      </div>

      <button>Add to Cart</button>

    </div>

  </div>
</body>
</html>
